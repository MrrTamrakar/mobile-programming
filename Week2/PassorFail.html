<html>
<head>
  <title>Marks Calculator</title>
</head>
<body>

  <h2>Student Marks Calculator</h2>

  <form id="marksForm">
    <label>English: </label>
    <input type="number" id="english" min="0" max="100" required><br><br>

    <label>Nepali: </label>
    <input type="number" id="nepali" min="0" max="100" required><br><br>

    <label>Math: </label>
    <input type="number" id="math" min="0" max="100" required><br><br>

    <label>Science: </label>
    <input type="number" id="science" min="0" max="100" required><br><br>

    <label>Social Studies: </label>
    <input type="number" id="social" min="0" max="100" required><br><br>

    <label>Health: </label>
    <input type="number" id="health" min="0" max="100" required><br><br>

    <label>Computer: </label>
    <input type="number" id="computer" min="0" max="100" required><br><br>

    <label>Account: </label>
    <input type="number" id="account" min="0" max="100" required><br><br>

    <button type="button" onclick="calculateResult()">Calculate Result</button>
  </form>

  <h2 id="resultText"></h2>

  <script src="PassorFail.js"></script>
</body>
</html>
