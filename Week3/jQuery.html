<html>
<head>

    <title>jQuery Practice</title>

    <link rel="stylesheet" href="jQuery.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>

    <div class="output-box">

        <h2>Output</h2>

        <div id="output">
            Output will appear here
        </div>

    </div>


    <div id="profile-card">

        <img id="profile-photo"
             src="Social Media-logo.png"
             width="120">

        <h1 id="student-name">
            Student Name
        </h1>

        <div id="student-bio">

            <p>I am learning jQuery.</p>
            <p>I enjoy learning web development.</p>

        </div>


        <input
            type="text"
            id="nickname-input"
            placeholder="Enter your nickname"
        >


        <h3>Skills</h3>

        <ul id="skills-list" >
            

            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>jQuery</li>

        </ul>

    </div>


    <div id="buttons">

        <h3>GET & SET</h3>

        <button id="show-name">
            Show Name
        </button>

        <button id="change-name">
            Change Name
        </button>

        <button id="show-bio">
            Show Bio
        </button>

        <button id="get-input">
            Get Input
        </button>

        <button id="set-input">
            Set Input
        </button>


        <h3>CSS CLASSES</h3>

        <button id="highlight-card">
            Highlight Card
        </button>

        <button id="remove-highlight">
            Remove Highlight
        </button>

        <button id="dark-mode">
            Toggle Dark Mode
        </button>

        <button id="rounded">
            Toggle Rounded
        </button>


        <h3>CSS METHOD</h3>

        <button id="red-background">
            Red Background
        </button>

        <button id="reset-background">
            Reset Background
        </button>


        <h3>HIDE & SHOW</h3>

        <button id="hide-photo">
            Hide Photo
        </button>

        <button id="show-photo">
            Show Photo
        </button>

        <button id="toggle-bio">
            Toggle Bio
        </button>


        <h3>FADE</h3>

        <button id="fade-out">
            Fade Out Card
        </button>

        <button id="fade-in">
            Fade In Card
        </button>

        <button id="fade-50">
            Fade to 50%
        </button>


        <h3>SLIDE</h3>

        <button id="slide-up">
            Slide Up Skills
        </button>

        <button id="slide-down">
            Slide Down Skills
        </button>

        <button id="slide-toggle">
            Slide Toggle Skills
        </button>


        <h3>ANIMATE</h3>

        <button id="animate-card">
            Animate Card
        </button>

    </div>


    <script src="jQuery.js"></script>

</body>
</html>
